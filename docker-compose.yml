services:
  dashboard:
    image: ${DOCKER_REGISTRY-}app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TZ=${DEFAULT_TIME_ZONE}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ASPNETCORE_HTTP_PORTS=${ASPNETCORE_HTTP_PORTS}
      - ASPNETCORE_HTTPS_PORTS=${ASPNETCORE_HTTPS_PORTS}
      - AppConfigurationSettings__ApplicationUrl=${APP_URL}
      - AppConfigurationSettings__AppName=${APP_NAME}
      - DatabaseSettings__DBProvider=${DB_PROVIDER}
      - DatabaseSettings__ConnectionString=${DB_CONNECTION_STRING}
      - DatabaseSettings__LogConnectionString=${DB_LOG_CONNECTION_STRING}
      - AISettings__GeminiApiKey=${GEMINI_API_KEY}
      - AISettings__OpenAIApiKey=${OPENAI_API_KEY}
      # The API key is the only mail secret, and the only one that belongs here. Domain, region and
      # from-address are environment-true rather than secret and live in appsettings.json.
      - Mail__ApiKey=${MAILGUN_API_KEY}
      - Authentication__Microsoft__ClientId=${MS_CLIENT_ID}
      - Authentication__Microsoft__ClientSecret=${MS_CLIENT_SECRET}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Storage__Provider=${STORAGE_PROVIDER}
      - Storage__ConnectionString=${STORAGE_CONNECTION_STRING}
      - Storage__ContainerName=${STORAGE_CONTAINER}
      - MaxMind__AccountId=${MAXMIND_ACCOUNT_ID}
      - MaxMind__LicenseKey=${MAXMIND_LICENSE_KEY}
 
    ports:
      - "5005:80"
      - "5006:443"
    depends_on:
      - sqldb
    restart: on-failure
    networks:
      - shared_bridge
    # volumes:
    #   - /etc/localtime:/etc/localtime:ro
    #   - /etc/timezone:/etc/timezone:ro

  sqldb:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      - SA_PASSWORD=${SQL_SERVER_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "3433:1433"
    restart: on-failure
    networks:
      - shared_bridge

volumes:
  mssql_data:

networks:
  shared_bridge:
    external: true
